name: Comprobar disponibilidad y cuentas
on:
  schedule:
    - cron: '29 */4 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - index.html
      - scripts/check-live-service.cjs
      - .github/workflows/service-health.yml
  push:
    branches: [gh-pages]
    paths:
      - scripts/check-live-service.cjs
      - .github/workflows/service-health.yml
permissions:
  contents: read
concurrency:
  group: disponibilidad-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Consultar sitio, base de datos y autenticación
        run: node scripts/check-live-service.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: estado-del-servicio
          path: service-status.json
          retention-days: 14
